[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist3"
version = "0.1.0"
description = "A general-purpose, auditable autonomous research pipeline in the style of ScientistTwo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "l1Ha" }]
keywords = [
    "autonomous-research",
    "scientific-workflow",
    "scientisttwo",
    "reproducibility",
    "integrity-audit",
    "ablation-study",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
toy = ["numpy>=1.24"]
health = ["numpy>=1.24", "torch>=2.1", "scikit-learn>=1.3"]
dev = ["numpy>=1.24", "pytest>=7.4"]

[project.scripts]
scientist3 = "scientist3.cli:main"

[tool.setuptools.packages.find]
include = ["scientist3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
